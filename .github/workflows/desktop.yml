name: Desktop CI and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.19.0"
  RUST_BACKTRACE: "1"

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      asset_version: ${{ steps.version.outputs.asset_version }}
      channel: ${{ steps.version.outputs.channel }}
      is_release: ${{ steps.version.outputs.is_release }}
      stable: ${{ steps.version.outputs.stable }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Check package, Tauri, Cargo, and tag versions
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];

          if (!cargoVersion) throw new Error("Could not read the Cargo package version.");
          if (pkg.version !== tauri.version || pkg.version !== cargoVersion) {
            throw new Error(
              `Version mismatch: package.json=${pkg.version}, tauri.conf.json=${tauri.version}, Cargo.toml=${cargoVersion}`,
            );
          }

          const tag = process.env.GITHUB_REF_TYPE === "tag" ? process.env.GITHUB_REF_NAME : "";
          const match = tag.match(/^v(\d+\.\d+\.\d+)(?:-test\.(\d+))?$/);
          if (tag && !match) {
            throw new Error("Release tags must use vX.Y.Z or vX.Y.Z-test.N.");
          }
          if (match && match[1] !== pkg.version) {
            throw new Error(`Tag version ${match[1]} does not match package version ${pkg.version}.`);
          }

          const isRelease = Boolean(match);
          const stable = isRelease && !match[2];
          const channel = !isRelease ? "ci" : stable ? "stable" : "test";
          const assetVersion = isRelease
            ? tag.slice(1)
            : `${pkg.version}-${process.env.GITHUB_SHA.slice(0, 7)}`;
          const output = [
            `asset_version=${assetVersion}`,
            `channel=${channel}`,
            `is_release=${isRelease}`,
            `stable=${stable}`,
            `version=${pkg.version}`,
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`);
          NODE

  quality:
    name: TypeScript and Rust checks
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Run frontend tests
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  build:
    name: Build ${{ matrix.name }}
    needs: metadata
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            slug: windows-x64
            asset_arch: x64
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            slug: macos-arm64
            asset_arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            slug: macos-x64
            asset_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Vite's transform of the Monaco bundle exceeds the ~2 GB default
      # Node heap on arm64 runners.
      NODE_OPTIONS: --max-old-space-size=4096
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build macOS DMG with an ad-hoc app signature
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Locate Windows signing input
        id: windows-source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sourceDir = "src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          $installers = @(Get-ChildItem -LiteralPath $sourceDir -File -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          "path=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate trusted Windows release configuration
        if: runner.os == 'Windows' && needs.metadata.outputs.stable == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $settings = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
          }
          $missing = @($settings.GetEnumerator() | Where-Object {
            [string]::IsNullOrWhiteSpace($_.Value)
          } | ForEach-Object Name)
          if ($missing.Count -gt 0) {
            throw "Trusted Windows release is blocked. Missing SignPath settings: $($missing -join ', ')."
          }

      - name: Upload Windows installer for SignPath
        id: upload-windows-signing-input
        if: runner.os == 'Windows' && needs.metadata.outputs.stable == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.windows-source.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: Submit Windows installer to SignPath
        if: runner.os == 'Windows' && needs.metadata.outputs.stable == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-windows-signing-input.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          skip-decompress: true

      - name: Verify and stage signed Windows installer
        if: runner.os == 'Windows' && needs.metadata.outputs.stable == 'true'
        shell: pwsh
        run: |
          $signedFiles = @(Get-ChildItem -LiteralPath signed -Recurse -File -Filter '*.exe')
          if ($signedFiles.Count -ne 1) {
            throw "Expected exactly one signed installer, found $($signedFiles.Count)."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $signedFiles[0].FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Authenticode verification failed: $($signature.Status) $($signature.StatusMessage)"
          }
          New-Item -ItemType Directory -Path final-assets -Force | Out-Null
          $destination = "final-assets/Nova_${{ needs.metadata.outputs.asset_version }}_windows_x64-setup.exe"
          Copy-Item -LiteralPath $signedFiles[0].FullName -Destination $destination -Force

      - name: Stage unsigned Windows CI or testing installer
        if: runner.os == 'Windows' && needs.metadata.outputs.stable != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path final-assets -Force | Out-Null
          $destination = "final-assets/Nova_${{ needs.metadata.outputs.asset_version }}_windows_x64-setup-UNSIGNED.exe"
          Copy-Item -LiteralPath '${{ steps.windows-source.outputs.path }}' -Destination $destination -Force

      - name: Verify and stage macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          set -- "$dmg_dir"/*.dmg
          if [[ "$#" -ne 1 || ! -f "$1" ]]; then
            echo "Expected exactly one DMG in $dmg_dir." >&2
            exit 1
          fi
          hdiutil verify "$1"
          # Tauri removes the staged .app after building the DMG, so verify the
          # signature from a read-only mount of the image itself.
          verify_mount="$(mktemp -d)/nova-verify"
          mkdir -p "$verify_mount"
          hdiutil attach "$1" -readonly -nobrowse -mountpoint "$verify_mount" >/dev/null
          codesign --verify --deep --strict --verbose=2 "$verify_mount/Nova.app"
          hdiutil detach "$verify_mount" >/dev/null
          mkdir -p final-assets
          cp "$1" "final-assets/Nova_${{ needs.metadata.outputs.asset_version }}_macos_${{ matrix.asset_arch }}.dmg"

      - name: Attest release artifact provenance
        if: needs.metadata.outputs.is_release == 'true'
        uses: actions/attest@v4
        with:
          subject-path: final-assets/*

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.slug }}
          path: final-assets/*
          if-no-files-found: error
          retention-days: ${{ needs.metadata.outputs.is_release == 'true' && 30 || 14 }}

  publish:
    name: Publish GitHub release
    if: needs.metadata.outputs.is_release == 'true'
    needs:
      - metadata
      - quality
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Validate release set and create checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) -print | sort)
          if [[ "${#assets[@]}" -ne 3 ]]; then
            printf 'Expected three desktop installers, found %s:\n' "${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]:-<none>}" >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "${assets[@]}" | grep -c '\.exe$')" -ne 1 ]]; then
            echo "Release must contain exactly one Windows installer." >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "${assets[@]}" | grep -c '\.dmg$')" -ne 2 ]]; then
            echo "Release must contain exactly two macOS disk images." >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum *.exe *.dmg | sort -k2 > SHA256SUMS.txt
          )

      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.metadata.outputs.stable }}" == "true" ]]; then
            trust_note="The Windows installer is Authenticode-signed through SignPath. The macOS apps use an ad-hoc signature and are not Apple-notarized; macOS may require approval in Privacy & Security on first launch."
          else
            trust_note="This is an unsigned testing release. Windows SmartScreen and macOS Gatekeeper may require explicit approval. Do not redistribute it as a trusted production build."
          fi
          cat > release-notes.md <<EOF
          Nova ${{ github.ref_name }} desktop release for Windows and macOS.

          - Windows 10/11 x64: NSIS setup executable
          - macOS 11+ Apple Silicon: arm64 DMG
          - macOS 11+ Intel: x64 DMG

          $trust_note

          Every installer was built from \`${{ github.sha }}\` by GitHub Actions. Verify the downloaded file with \`SHA256SUMS.txt\` or \`gh attestation verify <file> -R ${{ github.repository }}\`.
          EOF

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [[ "${{ needs.metadata.outputs.stable }}" == "true" ]]; then
              gh release edit "$tag" --title "Nova $tag" --notes-file release-notes.md --latest --repo "$GITHUB_REPOSITORY"
            else
              gh release edit "$tag" --title "Nova $tag (Unsigned Test)" --notes-file release-notes.md --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
            fi
          elif [[ "${{ needs.metadata.outputs.stable }}" == "true" ]]; then
            gh release create "$tag" "${assets[@]}" --verify-tag --title "Nova $tag" --notes-file release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --title "Nova $tag (Unsigned Test)" --notes-file release-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          fi
