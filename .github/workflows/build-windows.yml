name: Build Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned NSIS installer
    runs-on: windows-2025

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/nsis/*.exe
          archive: false
          if-no-files-found: error

      - name: Validate trusted release configuration
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test.')
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion."
          }

          $settings = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
          }
          $missing = @($settings.GetEnumerator() | Where-Object {
            [string]::IsNullOrWhiteSpace($_.Value)
          } | ForEach-Object Name)
          if ($missing.Count -gt 0) {
            throw "Trusted release is blocked. Missing SignPath settings: $($missing -join ', ')."
          }

      - name: Submit installer to SignPath
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test.')
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          skip-decompress: true

      - name: Verify and prepare signed release
        id: prepare-release
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test.')
        shell: pwsh
        run: |
          $signedFiles = @(Get-ChildItem -Path signed -Recurse -File -Filter '*.exe')
          if ($signedFiles.Count -ne 1) {
            throw "Expected exactly one signed installer, found $($signedFiles.Count)."
          }

          $signature = Get-AuthenticodeSignature -FilePath $signedFiles[0].FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Signed installer verification failed: $($signature.Status) $($signature.StatusMessage)"
          }

          $version = "${{ github.ref_name }}" -replace '^v', ''
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $destination = Join-Path (Resolve-Path release-assets) "Nova_${version}_x64-setup.exe"
          Copy-Item -LiteralPath $signedFiles[0].FullName -Destination $destination -Force
          $sha256 = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
          $publisher = $signature.SignerCertificate.Subject

          @"
          Nova v$version is a trusted Windows release signed through SignPath.

          - Authenticode status: Valid
          - Publisher certificate: $publisher
          - SHA-256: ``$sha256``

          The release workflow blocks publication if the tag and package versions differ,
          SignPath does not complete successfully, or Windows cannot validate the signature.
          "@ | Set-Content -Path release-notes.md -Encoding utf8

          "path=$destination" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload verified signed installer
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test.')
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare-release.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: Publish trusted GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ steps.prepare-release.outputs.path }}" `
            --verify-tag `
            --title "Nova ${{ github.ref_name }}" `
            --notes-file release-notes.md `
            --latest

      - name: Validate unsigned testing tag
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-test.')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)-test\.\d+$') {
            throw "Unsigned testing tags must use vX.Y.Z-test.N."
          }
          $packageVersion = node -p "require('./package.json').version"
          if ($Matches.version -ne $packageVersion) {
            throw "Tag version $($Matches.version) does not match package version $packageVersion."
          }

      - name: Prepare unsigned testing release
        id: prepare-unsigned-release
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-test.')
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -File -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one unsigned installer, found $($installers.Count)."
          }

          $version = "${{ github.ref_name }}" -replace '^v', ''
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $destination = Join-Path (Resolve-Path release-assets) "Nova_${version}_x64-setup-UNSIGNED.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $destination -Force
          $sha256 = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash

          @"
          # Nova $version (unsigned testing build)

          **Warning:** This is an unsigned pre-release for direct testing. Windows
          SmartScreen may display an unknown-publisher warning. Do not redistribute
          this installer as a trusted production release.

          - Build source: GitHub Actions from tag ${{ github.ref_name }}
          - SHA-256: ``$sha256``

          The latest stable release remains blocked until SignPath returns a valid
          Authenticode signature.
          "@ | Set-Content -Path unsigned-release-notes.md -Encoding utf8

          "path=$destination" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish unsigned testing pre-release
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-test.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ steps.prepare-unsigned-release.outputs.path }}" `
            --verify-tag `
            --title "Nova ${{ github.ref_name }} (Unsigned Test)" `
            --notes-file unsigned-release-notes.md `
            --prerelease
